[package]
name = "sidetone"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Windows tray microphone monitor with noise cancellation, adjustable delay, and volume control"
build = "build.rs"

[workspace]
members = ["noise-cancellation/native"]
default-members = ["."]

[features]
default = []
noise-cancellation = ["dep:serde_json", "dep:sha2", "windows-sys/Win32_Security_Cryptography"]

[dependencies]
anyhow = "1"
auto-launch = "0.5"
clap = { version = "4.6.1", features = ["derive"] }
cpal = "0.16"
crossbeam-queue = "0.3"
dirs = "4"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
toml = "1.1.2"
tray-icon = "0.26"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
winreg = "0.52"

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
